# Avvio:  docker compose up -d --build
#
# Due contenitori. `jobseeker` e' l'applicazione e non espone nessuna porta
# verso l'esterno: ci si arriva solo passando da `caddy`, che si occupa di
# HTTPS. Il certificato lo prende e lo rinnova da solo da Let's Encrypt.
#
# HTTPS non e' un vezzo: utente e password viaggiano dentro la richiesta
# quando si fa l'accesso, e poi il cookie di sessione a ogni chiamata. Senza
# TLS chiunque stia sulla rete di mezzo li legge. In piu' le notifiche del
# browser e l'installazione come app funzionano solo su https.
#
# Le variabili stanno in `environment` e non in `env_file`, per una ragione
# precisa: `env_file` pretende un file .env dentro la cartella del progetto,
# che con Portainer (o con qualunque deploy da git) non esiste, e il deploy
# fallisce con "env file ... not found". Cosi' invece funzionano entrambi i
# casi: le variabili della stack in Portainer, e il file .env quando si lancia
# `docker compose` a mano, perche' compose lo legge da solo per interpolare.

services:
  jobseeker:
    image: docker.io/zaabe/jobseeker
    container_name: jobseeker
    restart: unless-stopped
    environment:
      # Con questa attiva e nessuna password, al primo avvio l'applicazione
      # serve solo la pagina di configurazione: utente, password e chiavi si
      # scelgono da lì, senza compilare niente a mano.
      JOBSEEKER_REQUIRE_AUTH: "true"
      JOBSEEKER_USER: ${JOBSEEKER_USER:-}
      JOBSEEKER_PASSWORD: ${JOBSEEKER_PASSWORD:-}
      # Fonti
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      # Notifiche
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      # Livello semantico opzionale
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Modello locale o servizio compatibile OpenAI: l'indirizzo e, se serve,
      # la chiave. Vedi `extra_hosts` qui sotto per il caso piu' comune.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Per raggiungere un modello che gira sul computer che ospita il
    # contenitore. Dentro il contenitore "localhost" e' il contenitore stesso,
    # quindi un Ollama sull'host non si vede: con questa riga lo si raggiunge
    # all'indirizzo  http://host.docker.internal:11434/v1  anche su Linux, dove
    # quel nome non esisterebbe (su Mac e Windows c'e' gia').
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jobseeker-data:/app/data
    ports:
      - "8050:8000"

